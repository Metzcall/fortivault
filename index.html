<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FortiVault · Cofres</title>
<style>
:root{
  --forti-red:#EE3124;--ink:#0b1f2e;
  --epic:#9b4dff;--epic2:#c89bff;--leg:#ffb020;--leg2:#ffe089;
  --bg0:#04080d;--bg1:#0a1722;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#eaf2f8;
  background:radial-gradient(1200px 700px at 50% -10%,#0e2236 0%,var(--bg1) 45%,var(--bg0) 100%);
  min-height:100%;overflow-x:hidden}
header{text-align:center;padding:34px 16px 6px;position:relative;z-index:2}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.brand .mark{width:34px;height:34px}
.brand h1{font-size:30px;letter-spacing:1px;font-weight:800}
.brand h1 span{color:var(--forti-red)}
.tagline{color:#9fb6c9;font-size:13px;letter-spacing:3px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:26px;max-width:1200px;margin:30px auto;padding:0 22px 70px;position:relative;z-index:2}
.chest{position:relative;border-radius:18px;padding:24px 18px 22px;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.08);text-align:center;
  transition:transform .25s,box-shadow .25s;overflow:hidden}
.chest:hover{transform:translateY(-6px)}
.chest .rar{position:absolute;top:12px;right:12px;font-size:10px;font-weight:800;letter-spacing:1.5px;
  padding:4px 9px;border-radius:20px;text-transform:uppercase;z-index:6}
.epic .rar{background:rgba(155,77,255,.18);color:var(--epic2);border:1px solid var(--epic)}
.legendary .rar{background:rgba(255,176,32,.16);color:var(--leg2);border:1px solid var(--leg)}
.epic{box-shadow:0 0 0 1px rgba(155,77,255,.25),0 14px 40px -18px var(--epic)}
.legendary{box-shadow:0 0 0 1px rgba(255,176,32,.3),0 14px 40px -16px var(--leg)}
.halo{position:absolute;inset:-30% 8% auto 8%;height:75%;border-radius:50%;
  filter:blur(40px);opacity:.5;z-index:0;animation:pulse 3s ease-in-out infinite}
.epic .halo{background:radial-gradient(circle,var(--epic),transparent 70%)}
.legendary .halo{background:radial-gradient(circle,var(--leg),transparent 70%)}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.9)}50%{opacity:.65;transform:scale(1.1)}}

.stage{position:relative;height:170px;display:flex;align-items:flex-end;justify-content:center;z-index:1;padding-bottom:6px}
.beam{position:absolute;left:50%;top:6px;width:70px;height:120px;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--leg2),transparent);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);
  opacity:0;z-index:2;pointer-events:none;filter:blur(2px)}
.chest.open .beam{animation:beam 1.2s ease forwards}
.epic .beam{background:linear-gradient(180deg,var(--epic2),transparent)}
@keyframes beam{0%{opacity:0}30%{opacity:.85}100%{opacity:0}}

.chestsvg{width:150px;height:150px;overflow:visible;animation:bob 2.8s ease-in-out infinite;z-index:3;position:relative}
.legendary .chestsvg{animation:bob 2.8s ease-in-out infinite, sheen 6s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sheen{0%,100%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}50%{filter:drop-shadow(0 0 16px var(--leg))}}
.chest.shake .chestsvg{animation:shake .45s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-2.5deg)}75%{transform:translate(3px,-1px) rotate(2.5deg)}}

.lidgrp{transform-box:fill-box;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.34,1.56,.5,1)}
.chest.open .lidgrp{transform:translateY(-26px) rotate(-14deg) scaleY(.96)}
.gemcore{animation:gem 2.2s ease-in-out infinite}
@keyframes gem{0%,100%{opacity:.85}50%{opacity:1;filter:drop-shadow(0 0 6px currentColor)}}

.title{font-size:16px;font-weight:700;margin-top:6px;position:relative;z-index:5}
.sub{font-size:12px;color:#9fb6c9;margin-top:2px;min-height:16px;position:relative;z-index:5}
.cta{margin-top:10px;font-size:11px;letter-spacing:1px;color:#cfe0ee;opacity:.8;position:relative;z-index:5}

.spark{position:absolute;width:7px;height:7px;border-radius:50%;opacity:0;z-index:6;pointer-events:none}
.chest.open .spark{animation:fly 1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}

.modal{position:fixed;inset:0;background:rgba(2,6,12,.82);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
.modal.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:linear-gradient(160deg,#0f2336,#0a1722);border-radius:20px;padding:26px;width:min(360px,90vw);
  text-align:center;border:1px solid rgba(255,255,255,.1);position:relative;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card.epic-c{box-shadow:0 0 50px -8px var(--epic)}
.card.leg-c{box-shadow:0 0 50px -6px var(--leg)}
.card .rar2{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.card.epic-c .rar2{color:var(--epic2)} .card.leg-c .rar2{color:var(--leg2)}
.card h2{font-size:20px;margin:6px 0 2px}
.card .url{font-size:11px;color:#8fa8bc;word-break:break-all;margin:8px 0 16px}
.qrwrap{background:#fff;padding:12px;border-radius:14px;display:inline-block}
.qrwrap img{width:220px;height:220px;display:block;image-rendering:pixelated}
.openbtn{margin-top:16px;display:inline-block;background:var(--forti-red);color:#fff;text-decoration:none;
  padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px}
.close{position:absolute;top:10px;right:14px;font-size:22px;color:#9fb6c9;cursor:pointer;border:0;background:none}
footer{text-align:center;color:#5f7689;font-size:11px;padding:0 0 30px;position:relative;z-index:2}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 100"><path d="M10 20 L50 8 L90 20 L90 50 C90 78 50 94 50 94 C50 94 10 78 10 50 Z" fill="none" stroke="#EE3124" stroke-width="7"/><path d="M34 50 h32 M50 34 v32" stroke="#EE3124" stroke-width="7" stroke-linecap="round"/></svg>
    <h1>Forti<span>Vault</span></h1>
  </div>
  <div class="tagline">Abre tu cofre · Escanea · Descubre</div>
</header>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="card" id="card">
    <button class="close" onclick="closeModal()">&times;</button>
    <div class="rar2" id="m-rar"></div>
    <h2 id="m-title"></h2>
    <div class="qrwrap"><img id="m-qr" alt="QR"></div>
    <div class="url" id="m-url"></div>
    <a class="openbtn" id="m-open" target="_blank" rel="noopener">Abrir enlace</a>
  </div>
</div>

const grid = document.getElementById('grid');

// Paletas por rareza para la madera/herrajes
const PAL = {
  epic:{wood1:'#5b3f8a',wood2:'#3a275e',wood3:'#2a1b48',metal1:'#d9c2ff',metal2:'#9b4dff',gem:'#c89bff',gemcore:'#fff'},
  legendary:{wood1:'#8a5a22',wood2:'#5e3a12',wood3:'#3d260a',metal1:'#ffe089',metal2:'#d4a017',gem:'#ffd54a',gemcore:'#fff8d8'}
};

function chestSVG(r){
  const p=PAL[r];
  return `
  <svg class="chestsvg" viewBox="0 0 150 150">
    <defs>
      <linearGradient id="w-${r}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${p.wood1}"/><stop offset="1" stop-color="${p.wood3}"/>
      </linearGradient>
      <linearGradient id="l-${r}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${p.wood1}"/><stop offset="1" stop-color="${p.wood2}"/>
      </linearGradient>
      <linearGradient id="m-${r}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${p.metal1}"/><stop offset="1" stop-color="${p.metal2}"/>
      </linearGradient>
      <radialGradient id="g-${r}" cx="50%" cy="40%" r="60%">
        <stop offset="0" stop-color="${p.gemcore}"/><stop offset="60%" stop-color="${p.gem}"/><stop offset="100%" stop-color="${p.metal2}"/>
      </radialGradient>
    </defs>
    <!-- sombra -->
    <ellipse cx="75" cy="138" rx="48" ry="8" fill="#000" opacity=".35"/>
    <!-- BASE -->
    <g>
      <rect x="26" y="78" width="98" height="52" rx="8" fill="url(#w-${r})" stroke="#1a1108" stroke-width="3"/>
      <rect x="26" y="78" width="98" height="10" fill="#000" opacity=".18"/>
      <line x1="50" y1="80" x2="50" y2="130" stroke="#000" opacity=".15" stroke-width="2"/>
      <line x1="100" y1="80" x2="100" y2="130" stroke="#000" opacity=".15" stroke-width="2"/>
      <!-- herrajes verticales -->
      <rect x="38" y="78" width="9" height="52" fill="url(#m-${r})" stroke="#1a1108" stroke-width="1.5"/>
      <rect x="103" y="78" width="9" height="52" fill="url(#m-${r})" stroke="#1a1108" stroke-width="1.5"/>
      <!-- cerradura -->
      <rect x="65" y="92" width="20" height="22" rx="3" fill="url(#m-${r})" stroke="#1a1108" stroke-width="2"/>
      <circle cx="75" cy="100" r="3.4" fill="#1a1108"/>
      <rect x="73.5" y="100" width="3" height="8" fill="#1a1108"/>
    </g>
    <!-- TAPA (se levanta) -->
    <g class="lidgrp">
      <path d="M26 86 Q26 50 75 50 Q124 50 124 86 Z" fill="url(#l-${r})" stroke="#1a1108" stroke-width="3"/>
      <path d="M26 86 Q26 50 75 50 Q124 50 124 86" fill="none" stroke="#fff" opacity=".12" stroke-width="3"/>
      <!-- herrajes curvos -->
      <path d="M38 84 Q38 58 47 56 L47 86 Z" fill="url(#m-${r})" stroke="#1a1108" stroke-width="1.5"/>
      <path d="M112 84 Q112 58 103 56 L103 86 Z" fill="url(#m-${r})" stroke="#1a1108" stroke-width="1.5"/>
      <rect x="24" y="82" width="102" height="8" rx="4" fill="url(#m-${r})" stroke="#1a1108" stroke-width="2"/>
      <!-- gema central -->
      <g class="gemcore" style="color:${p.gem}">
        <path d="M75 60 l11 8 -11 13 -11 -13 Z" fill="url(#g-${r})" stroke="#fff" stroke-width="1" opacity=".95"/>
      </g>
    </g>
  </svg>`;
}

DATA.forEach(c=>{
  const el=document.createElement('div');
  el.className='chest '+c.rarity;
  el.innerHTML=`
    <div class="halo"></div>
    <div class="rar">${c.rarity==='legendary'?'Legendario':'Épico'}</div>
    <div class="stage">
      <div class="beam"></div>
      ${chestSVG(c.rarity)}
    </div>
    <div class="title">${c.title}</div>
    <div class="sub">${c.sub}</div>
    <div class="cta">▸ Toca para abrir</div>`;
  el.addEventListener('click',()=>openChest(el,c));
  grid.appendChild(el);
});

function sparkle(el){
  const stage=el.querySelector('.stage');
  for(let i=0;i<18;i++){
    const s=document.createElement('div');s.className='spark';
    const ang=Math.random()*6.28, d=45+Math.random()*70;
    s.style.setProperty('--dx',(Math.cos(ang)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*d-35)+'px');
    s.style.left='50%';s.style.top='45%';
    const cols=el.classList.contains('legendary')?['#ffe089','#fff','#ffd54a']:['#c89bff','#fff','#9b4dff'];
    s.style.background=cols[i%3];
    stage.appendChild(s);setTimeout(()=>s.remove(),1100);
  }
}

function openChest(el,c){
  if(el.classList.contains('busy'))return;
  el.classList.add('busy','shake');
  setTimeout(()=>{
    el.classList.remove('shake');el.classList.add('open');
    sparkle(el);
    setTimeout(()=>showModal(c),500);
    setTimeout(()=>{el.classList.remove('open','busy')},1500);
  },650);
}

function showModal(c){
  const card=document.getElementById('card');
  card.className='card '+(c.rarity==='legendary'?'leg-c':'epic-c');
  document.getElementById('m-rar').textContent=(c.rarity==='legendary'?'★ Legendario':'◆ Épico');
  document.getElementById('m-title').textContent=c.title;
  document.getElementById('m-qr').src=c.qr;
  document.getElementById('m-url').textContent=c.url;
  document.getElementById('m-open').href=c.url;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
